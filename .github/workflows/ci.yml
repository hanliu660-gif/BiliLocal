# BiliLocal CI：只编 5 个单测目标并运行（单测不链 libvlc，不需要 VLC SDK）。
# 主程序 + hook-gate 留在本机验证（CI 虚机的 D3D11/GL 不可信，见交接文档 §8）。
# Qt/MinGW 经 aqt 安装并缓存；首次运行约几分钟，命中缓存后秒级恢复。
name: ci

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: windows-latest
    env:
      QT_ROOT: D:\a\qt
    steps:
      - uses: actions/checkout@v4

      - name: Cache Qt 5.15.2 (mingw81) + MinGW 8.1
        id: qtcache
        uses: actions/cache@v4
        with:
          path: D:\a\qt
          key: qt-5.15.2-mingw81-v2

      - name: Install Qt and MinGW
        if: steps.qtcache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          pip install aqtinstall
          aqt install-qt windows desktop 5.15.2 win64_mingw81 -O $env:QT_ROOT
          # aqt 的 tools_mingw810 元数据在 qt.io 已拉不到（checksum 404）；
          # 改下 mingw-builds 官方 8.1.0（与 Qt 配套的同源构建），用 7zr 解
          curl.exe -sL -o "$env:RUNNER_TEMP\7zr.exe" "https://www.7-zip.org/a/7zr.exe"
          curl.exe -sL -o "$env:RUNNER_TEMP\mingw81.7z" "https://sourceforge.net/projects/mingw-w64/files/Toolchains%20targetting%20Win64/Personal%20Builds/mingw-builds/8.1.0/threads-posix/seh/x86_64-8.1.0-release-posix-seh-rt_v6-rev0.7z"
          & "$env:RUNNER_TEMP\7zr.exe" x -y -o"$env:QT_ROOT\mgw81" "$env:RUNNER_TEMP\mingw81.7z" | Out-Null
          Test-Path "$env:QT_ROOT\mgw81\mingw64\bin\mingw32-make.exe"

      - name: Configure (tests only)
        shell: pwsh
        run: |
          $env:PATH = "$env:QT_ROOT\Tools\mingw810_64\bin;$env:QT_ROOT\5.15.2\mingw81_64\bin;" + $env:PATH
          cmake -G "MinGW Makefiles" -B build -S src `
            -DCMAKE_BUILD_TYPE=Release `
            -DBILILOCAL_BUILD_APP=OFF `
            "-DQt5_DIR=$env:QT_ROOT\5.15.2\mingw81_64\lib\cmake\Qt5"

      - name: Build test targets
        shell: pwsh
        run: |
          $env:PATH = "$env:QT_ROOT\Tools\mingw810_64\bin;$env:QT_ROOT\5.15.2\mingw81_64\bin;" + $env:PATH
          cmake --build build -j

      - name: Run unit tests
        shell: pwsh
        run: |
          $env:PATH = "$env:QT_ROOT\5.15.2\mingw81_64\bin;$env:GITHUB_WORKSPACE\build;" + $env:PATH
          ctest --test-dir build --output-on-failure -C Release
